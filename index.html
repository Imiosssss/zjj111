<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>朱嘉俊 · 个人简历</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --primary: #1e3a5f;
            --primary-light: #2a5298;
            --primary-dark: #0f1f33;
            --accent: #d4a843;
            --accent-light: #e8c96e;
            --bg-start: #e8edf5;
            --bg-end: #d5dcec;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --border: #e2e6ee;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.15);
            --radius: 20px;
            --radius-sm: 10px;
            --transition: 0.22s cubic-bezier(0.2, 0, 0, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --max-width: 1160px;
            --nav-height: 68px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-start: #0f0f23;
                --bg-end: #1a1a3a;
                --card-bg: rgba(26, 26, 48, 0.85);
                --card-border: rgba(255, 255, 255, 0.06);
                --text-primary: #e8e8f2;
                --text-secondary: #b0b0cc;
                --text-muted: #78789a;
                --border: #2a2a48;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.7);
            }
        }
        [data-theme="dark"] {
            --bg-start: #0f0f23;
            --bg-end: #1a1a3a;
            --card-bg: rgba(26, 26, 48, 0.85);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #e8e8f2;
            --text-secondary: #b0b0cc;
            --text-muted: #78789a;
            --border: #2a2a48;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.7);
        }
        [data-theme="light"] {
            --bg-start: #e8edf5;
            --bg-end: #d5dcec;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --border: #e2e6ee;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.15);
        }

        /* ===== Global Background ===== */
        body {
            background: linear-gradient(145deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }
        body::before {
            width: 500px;
            height: 500px;
            top: -150px;
            right: -150px;
            background: radial-gradient(circle, var(--accent-light), transparent 70%);
        }
        body::after {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle, var(--primary-light), transparent 70%);
        }

        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: var(--font);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.4s, color var(--transition);
            padding-top: var(--nav-height);
            backdrop-filter: blur(2px);
        }
        a {
            color: var(--primary-light);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--accent);
        }
        ::selection {
            background: var(--accent);
            color: #fff;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ===== Navbar ===== */
        #navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: rgba(30, 58, 95, 0.85);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            transition: background var(--transition), box-shadow var(--transition);
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.06);
        }
        #navbar .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #navbar .nav-brand span {
            color: var(--accent-light);
        }
        #navbar .nav-links {
            display: flex;
            gap: 6px;
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }
        #navbar .nav-links a {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 40px;
            transition: all var(--transition);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        #navbar .nav-links a:hover,
        #navbar .nav-links a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }
        #navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #navbar .nav-actions button {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all var(--transition);
            backdrop-filter: blur(4px);
        }
        #navbar .nav-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        #navbar .nav-actions button:active {
            transform: scale(0.94);
        }
        .nav-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            transition: background var(--transition);
        }
        .nav-toggle:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* ===== Container ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px 40px;
            position: relative;
            z-index: 1;
        }

        /* ===== Sections ===== */
        section {
            margin-bottom: 48px;
            opacity: 0;
            transform: translateY(28px);
            animation: sectionIn 0.6s ease forwards;
        }
        section:nth-child(1) { animation-delay: 0.05s; }
        section:nth-child(2) { animation-delay: 0.10s; }
        section:nth-child(3) { animation-delay: 0.15s; }
        section:nth-child(4) { animation-delay: 0.20s; }
        section:nth-child(5) { animation-delay: 0.25s; }
        @keyframes sectionIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
            border-radius: 4px;
        }
        .section-title .badge-count {
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--accent);
            color: #fff;
            padding: 2px 10px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        /* ===== Cards (Glassmorphism) ===== */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .glass-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        /* ===== Hero ===== */
        #hero {
            padding: 36px 0 20px;
            animation-delay: 0.02s;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .hero-content h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.2;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .hero-content h1 .highlight {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-sub {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 400;
        }
        .hero-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 520px;
            margin-bottom: 20px;
            line-height: 1.7;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }
        .hero-tags .tag {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .hero-tags .tag:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .hero-actions .btn {
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(30, 58, 95, 0.25);
        }
        .hero-actions .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(30, 58, 95, 0.35);
        }
        .hero-actions .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1.5px solid var(--border);
            box-shadow: none;
            backdrop-filter: blur(4px);
        }
        .hero-actions .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 8px 28px rgba(212, 168, 67, 0.15);
        }
        .hero-actions .btn-accent {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(212, 168, 67, 0.35);
        }
        .hero-actions .btn-accent:hover {
            background: var(--accent-light);
            box-shadow: 0 8px 28px rgba(212, 168, 67, 0.45);
        }

        .hero-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--card-border);
            min-height: 140px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
        }

        /* ===== Experience placeholder ===== */
        .exp-placeholder {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 32px 28px;
            border: 2px dashed var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .exp-placeholder .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== Project placeholder ===== */
        .project-placeholder {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 32px 28px;
            border: 2px dashed var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .project-placeholder .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== Skills Matrix ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 40px;
        }
        .skill-group .sg-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }
        .skill-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .skill-row .skill-name {
            font-size: 0.82rem;
            color: var(--text-primary);
            min-width: 100px;
            font-weight: 500;
        }
        .skill-row .skill-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .skill-row .skill-bar .fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--primary-light), var(--accent));
            width: 0%;
            transition: width 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        .skill-row .skill-level {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 36px;
            text-align: right;
            font-weight: 500;
        }
        .skill-tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .skill-tags-wrap .skill-tag {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all var(--transition);
        }
        .skill-tags-wrap .skill-tag:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ===== Education & Cert ===== */
        .edu-cert-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .edu-card,
        .cert-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 22px 26px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .edu-card:hover,
        .cert-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .edu-card .edu-school {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
        }
        .edu-card .edu-major {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .edu-card .edu-date {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .edu-card .edu-high {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .cert-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .cert-item:last-child {
            border-bottom: none;
        }
        .cert-item .cert-name {
            font-size: 0.88rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        .cert-item .cert-date {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* ===== 证书卡片 - 图片与名称一一对应排版 ===== */
        .cert-card .cert-entry {
            display: flex;
            flex-direction: column;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .cert-card .cert-entry:first-of-type {
            border-top: none;
            margin-top: 8px;
            padding-top: 0;
        }
        .cert-card .cert-entry .cert-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cert-card .cert-entry .cert-label .badge {
            font-size: 0.65rem;
            font-weight: 500;
            background: var(--accent);
            color: #fff;
            padding: 0 10px;
            border-radius: 20px;
            line-height: 1.8;
        }
        .cert-img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            display: block;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }
        .cert-img:hover {
            transform: scale(1.01);
        }
        .cert-img-error {
            display: block;
            padding: 16px;
            background: var(--bg-start);
            border-radius: var(--radius-sm);
            border: 1px dashed var(--border);
            color: var(--text-muted);
            text-align: center;
            font-size: 0.85rem;
        }

        /* ===== Footer ===== */
        #footer {
            text-align: center;
            padding: 32px 24px 24px;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.78rem;
            margin-top: 20px;
            backdrop-filter: blur(4px);
        }
        #footer .footer-heart {
            color: var(--accent);
        }

        /* ===== Back to Top ===== */
        #backTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(30, 58, 95, 0.35);
            transition: all var(--transition);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            z-index: 999;
        }
        #backTop.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }
        #backTop:hover {
            background: var(--accent);
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(212, 168, 67, 0.4);
        }

        /* ===== Print ===== */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding-top: 0 !important;
                font-size: 12px;
            }
            body::before,
            body::after { display: none !important; }
            #navbar {
                position: static !important;
                background: #fff !important;
                backdrop-filter: none !important;
                border-bottom: 2px solid #ccc !important;
                box-shadow: none !important;
                padding: 12px 24px !important;
            }
            #navbar .nav-brand { color: #1a1a2e !important; }
            #navbar .nav-brand span { color: #c9a84c !important; }
            #navbar .nav-links a,
            #navbar .nav-actions button { display: none !important; }
            .nav-toggle { display: none !important; }
            #backTop { display: none !important; }
            .container {
                max-width: 100% !important;
                padding: 0 20px 20px !important;
            }
            .hero-grid { grid-template-columns: 1fr !important; gap: 20px !important; }
            .hero-placeholder {
                border-color: #ddd !important;
                background: #f9f9f9 !important;
                backdrop-filter: none !important;
            }
            .skills-grid { grid-template-columns: 1fr !important; }
            .edu-cert-grid { grid-template-columns: 1fr !important; }
            .exp-placeholder {
                border-color: #ddd !important;
                background: #f9f9f9 !important;
                backdrop-filter: none !important;
            }
            .project-placeholder {
                border-color: #ddd !important;
                background: #f9f9f9 !important;
                backdrop-filter: none !important;
            }
            section {
                margin-bottom: 24px !important;
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .section-title { font-size: 1.1rem !important; }
            .section-title::after { display: none !important; }
            .hero-actions .btn {
                padding: 6px 16px !important;
                font-size: 0.75rem !important;
                box-shadow: none !important;
            }
            .hero-actions .btn-outline { border-color: #999 !important; }
            .hero-desc { max-width: 100% !important; }
            .edu-card, .cert-card {
                box-shadow: none !important;
                border-color: #ddd !important;
                background: #fff !important;
                backdrop-filter: none !important;
            }
            .edu-card:hover, .cert-card:hover {
                transform: none !important;
                box-shadow: none !important;
            }
            #footer {
                border-top: 1px solid #ddd !important;
                padding: 16px !important;
                margin-top: 0 !important;
            }
            .hero-tags .tag {
                background: #f5f5f5 !important;
                border-color: #ddd !important;
                box-shadow: none !important;
            }
            .skill-row .skill-bar { background: #e0e0e0 !important; }
            .skill-row .skill-bar .fill { background: #1a2a4a !important; }
            .cert-item .cert-name { color: #000 !important; }
            .cert-img {
                border-color: #ddd !important;
                box-shadow: none !important;
            }
            .cert-img-error {
                border-color: #ddd !important;
                background: #f9f9f9 !important;
            }
            .glass-card {
                background: #fff !important;
                backdrop-filter: none !important;
                border-color: #ddd !important;
                box-shadow: none !important;
            }
            .cert-card .cert-entry {
                border-top-color: #ddd !important;
            }
            [data-theme] {
                --bg-start: #fff !important;
                --bg-end: #fff !important;
                --card-bg: #fff !important;
                --card-border: #ddd !important;
                --text-primary: #000 !important;
                --text-secondary: #333 !important;
                --text-muted: #666 !important;
                --border: #ddd !important;
                --shadow: none !important;
                --shadow-hover: none !important;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; gap: 28px; }
            .skills-grid { grid-template-columns: 1fr; }
            .edu-cert-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 700px) {
            :root { --nav-height: 60px; }
            #navbar { padding: 0 16px; }
            #navbar .nav-brand { font-size: 1rem; }
            #navbar .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                right: 0;
                background: rgba(30, 58, 95, 0.97);
                backdrop-filter: blur(14px);
                padding: 16px 20px;
                gap: 4px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }
            #navbar .nav-links.open { display: flex; }
            #navbar .nav-links a {
                padding: 10px 16px;
                font-size: 0.9rem;
                width: 100%;
                text-align: center;
            }
            .nav-toggle { display: flex; align-items: center; justify-content: center; }
            .hero-content h1 { font-size: 2rem; }
            .container { padding: 0 14px 24px; }
            #backTop { bottom: 16px; right: 16px; width: 42px; height: 42px; font-size: 1.1rem; }
            .hero-actions .btn { padding: 8px 20px; font-size: 0.8rem; }
            .section-title { font-size: 1.2rem; }
            body::before { width: 300px; height: 300px; top: -80px; right: -80px; }
            body::after { width: 250px; height: 250px; bottom: -60px; left: -60px; }
        }
        @media (max-width: 480px) {
            .hero-content h1 { font-size: 1.7rem; }
            .hero-tags .tag { font-size: 0.65rem; padding: 3px 12px; }
            .skills-grid { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            html { scroll-behavior: auto !important; }
            section { opacity: 1 !important; transform: none !important; }
            .skill-row .skill-bar .fill { transition: none !important; }
        }

        .text-accent { color: var(--accent); }
        .text-muted { color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav id="navbar" role="navigation" aria-label="主导航">
        <div class="nav-brand">
            <span>✦</span> 朱嘉俊<span>.</span>
        </div>
        <ul class="nav-links" id="navLinks" role="menubar">
            <li role="none"><a href="#hero" role="menuitem">摘要</a></li>
            <li role="none"><a href="#experience" role="menuitem">经历</a></li>
            <li role="none"><a href="#projects" role="menuitem">项目</a></li>
            <li role="none"><a href="#skills" role="menuitem">技能</a></li>
            <li role="none"><a href="#education" role="menuitem">教育</a></li>
        </ul>
        <div class="nav-actions">
            <button id="themeToggle" aria-label="切换深浅色模式" title="切换深浅色模式">🌓</button>
            <button id="printBtn" aria-label="打印简历" title="打印简历">🖨️</button>
            <button class="nav-toggle" id="navToggle" aria-label="切换导航菜单" aria-expanded="false">☰</button>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container" id="app" role="main"></main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer" role="contentinfo">
        <p>© 2026 朱嘉俊 · 用 <span class="footer-heart">♥</span> 打造 · 最后更新 2026年8月</p>
    </footer>

    <!-- ===== BACK TO TOP ===== -->
    <button id="backTop" aria-label="返回顶部" title="返回顶部">↑</button>

    <script>
        // ================================================================
        //  DATA: resume
        // ================================================================
        const resume = {
            name: '朱嘉俊',
            phone: '15180863507',
            qq: '3324140177',
            email: '3324140177@qq.com',
            address: '湖北·武汉（即将入学）',
            summary: '准大一新生，常打乒乓球、踢足球（虽然技术不太好），喜欢阅读小说，希望能结识到更多的同伴。',
            tags: ['Python', 'Pandas', 'Requests', 'BeautifulSoup', '3DMAX', 'ZBrush', 'Photoshop', 'PPT设计', '英语二级A'],
            experience: [],
            projects: [],
            skills: {
                '编程与开发': [
                    { name: 'Python 基础', level: 75 },
                    { name: 'Pandas / Requests', level: 68 },
                    { name: 'HTML / CSS', level: 55 },
                    { name: 'Vibe Coding', level: 60 },
                ],
                '三维建模与数字艺术': [
                    { name: '3DMAX', level: 65 },
                    { name: 'ZBrush', level: 60 },
                    { name: 'Photoshop', level: 70 },
                    { name: 'PT (Painter)', level: 55 },
                ],
                '人工智能与数据': [
                    { name: '机器学习基础', level: 62 },
                    { name: '数据探索与清洗', level: 70 },
                    { name: '特征工程与调优', level: 55 },
                ],
                '办公与表达': [
                    { name: 'PowerPoint 设计', level: 82 },
                    { name: '技术文档撰写', level: 68 },
                    { name: '英语（二级A）', level: 60 },
                ]
            },
            education: {
                university: '武汉理工大学',
                major: '材料科学与工程（本科）',
                date: '2026.09 – 2030.06（预期）',
                highSchool: '贵阳市第一中学（贵州省首批重点示范性高中）',
                gpa: ''
            },
            certificates: [
                { name: '阿里达摩院人工智能高级训练师（认证证书）', date: '2026.07' },
                { name: '青少年机器人技术等级考试二级证书', date: '2019.12' },
                { name: '高中英语写作大赛决赛二等奖', date: '2025.12' },
                { name: '全国英语听说能力测评二级A', date: '2022.03' },
            ],
            // 证书图片映射：证书名称 → 图片文件名
            certImages: {
                '阿里达摩院人工智能高级训练师（认证证书）': '阿里人工智能训练师证书.jpg',
                '青少年机器人技术等级考试二级证书': '青少年机器人证书.jpg'
            }
        };

        // ================================================================
        //  RENDER ENGINE
        // ================================================================
        const app = document.getElementById('app');

        function render() {
            let html = '';

            // ---- HERO ----
            html += `
            <section id="hero">
              <div class="hero-grid">
                <div class="hero-content">
                  <h1>朱嘉俊 <span class="highlight">·</span> 准大一</h1>
                  <div class="hero-sub">材料科学与工程 · 武汉理工大学</div>
                  <p class="hero-desc">${resume.summary}</p>
                  <div class="hero-tags">
                    ${resume.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                  </div>
                  <div class="hero-actions">
                    <button class="btn" id="contactBtn" aria-label="显示联系方式">📬 联系我</button>
                    <button class="btn btn-outline" id="copyEmailBtn" aria-label="复制邮箱">📋 复制邮箱</button>
                    <a href="#education" class="btn btn-accent">📖 了解更多</a>
                  </div>
                </div>
                <div class="hero-placeholder glass-card">
                  🌱 准大一 · 保持热爱
                </div>
              </div>
            </section>
          `;

            // ---- EXPERIENCE (空状态) ----
            html += `
            <section id="experience">
              <div class="section-title">💼 经历 <span class="badge-count">0</span></div>
              <div class="exp-placeholder glass-card">
                <span class="emoji">📖</span>
                正在努力学习中 · 作为一名准大一新生，我正专注于打好专业基础，<br />
                积极学习编程、三维建模与人工智能相关知识，期待在大学阶段积累更多实践经历。
              </div>
            </section>
          `;

            // ---- PROJECTS (占位) ----
            html += `
            <section id="projects">
              <div class="section-title">🚀 项目 <span class="badge-count">0</span></div>
              <div class="project-placeholder glass-card">
                <span class="emoji">🌱</span>
                暂无正式项目经历 · 正在通过课程与自学积累实践能力<br />
                <span style="font-size:0.85rem;color:var(--text-muted);">准大一新生，保持学习与探索的热情</span>
              </div>
            </section>
          `;

            // ---- SKILLS ----
            html += `
            <section id="skills">
              <div class="section-title">🧠 技能矩阵</div>
              <div class="skills-grid">
                ${Object.entries(resume.skills).map(([group, items]) => `
                  <div class="skill-group glass-card" style="padding:20px 24px;border-radius:var(--radius);">
                    <div class="sg-title">${group}</div>
                    ${items.map(s => `
                      <div class="skill-row">
                        <span class="skill-name">${s.name}</span>
                        <div class="skill-bar"><div class="fill" style="width:${s.level}%;" data-width="${s.level}"></div></div>
                        <span class="skill-level">${s.level}%</span>
                      </div>
                    `).join('')}
                  </div>
                `).join('')}
              </div>
              <div class="skill-tags-wrap" style="margin-top:20px;">
                ${resume.tags.map(t => `<span class="skill-tag">#${t}</span>`).join('')}
              </div>
            </section>
          `;

            // ---- EDUCATION & CERTIFICATES ----
            // 筛选出有对应图片的证书（前两个），并保留其他证书文字展示
            const certsWithImages = resume.certificates.slice(0, 2);
            const otherCerts = resume.certificates.slice(2);

            html += `
            <section id="education">
              <div class="section-title">🎓 教育 & 证书</div>
              <div class="edu-cert-grid">
                <div class="edu-card glass-card">
                  <div class="edu-school">${resume.education.university}</div>
                  <div class="edu-major">${resume.education.major}</div>
                  <div class="edu-date">${resume.education.date}</div>
                  <div class="edu-high">🏫 ${resume.education.highSchool}</div>
                  ${resume.education.gpa ? `<div class="edu-high">📊 GPA: ${resume.education.gpa}</div>` : ''}
                </div>
                <div class="cert-card glass-card">
                  <div style="font-weight:600;font-size:0.95rem;margin-bottom:12px;color:var(--text-primary);">📜 证书</div>

                  <!-- 有图片的证书：一一对应展示 -->
                  ${certsWithImages.map(c => {
                    const imgFile = resume.certImages[c.name] || '';
                    return `
                      <div class="cert-entry">
                        <div class="cert-label">
                          ${c.name}
                          <span class="badge">${c.date}</span>
                        </div>
                        ${imgFile ? `
                          <img class="cert-img"
                               src="${imgFile}"
                               alt="${c.name}"
                               onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                          <div class="cert-img-error" style="display:none;">
                            ⚠️ 图片「${imgFile}」未找到，请确认文件已放在同目录下
                          </div>
                        ` : `
                          <div class="cert-img-error">📄 证书图片暂无</div>
                        `}
                      </div>
                    `;
                  }).join('')}

                  <!-- 其他无图片证书（仅文字） -->
                  ${otherCerts.length > 0 ? otherCerts.map(c => `
                    <div class="cert-entry" style="border-top:1px solid var(--border);padding-top:12px;margin-top:12px;">
                      <div class="cert-label" style="font-weight:500;font-size:0.85rem;color:var(--text-secondary);">
                        ${c.name}
                        <span style="font-size:0.7rem;color:var(--text-muted);font-weight:400;">${c.date}</span>
                      </div>
                    </div>
                  `).join('') : ''}
                </div>
              </div>
            </section>
          `;

            app.innerHTML = html;

            // ---- Post-render init ----
            initSkillsAnimation();
            initContact();
            initCopyEmail();
            initNavScroll();
            initBackTop();
            initThemeToggle();
            initPrint();
            initMobileNav();
        }

        // ================================================================
        //  INTERACTIONS
        // ================================================================

        function initSkillsAnimation() {
            const fills = document.querySelectorAll('.skill-bar .fill');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const w = el.getAttribute('data-width') || '0';
                        el.style.width = w + '%';
                        observer.unobserve(el);
                    }
                });
            }, { threshold: 0.3 });
            fills.forEach(el => {
                el.style.width = '0%';
                observer.observe(el);
            });
        }

        function initContact() {
            const btn = document.getElementById('contactBtn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                alert(`📞 电话: ${resume.phone}  |  QQ: ${resume.qq}  |  地址: ${resume.address}`);
            });
        }

        function initCopyEmail() {
            const btn = document.getElementById('copyEmailBtn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                const parts = resume.email.split('@');
                if (parts.length === 2) {
                    const email = parts[0] + '@' + parts[1];
                    navigator.clipboard.writeText(email).then(() => {
                        const orig = btn.textContent;
                        btn.textContent = '✅ 已复制';
                        setTimeout(() => { btn.textContent = orig; }, 1800);
                    }).catch(() => {
                        const email = parts[0] + '@' + parts[1];
                        const ta = document.createElement('textarea');
                        ta.value = email;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        const orig = btn.textContent;
                        btn.textContent = '✅ 已复制';
                        setTimeout(() => { btn.textContent = orig; }, 1800);
                    });
                } else {
                    alert('邮箱地址暂未配置');
                }
            });
        }

        function initNavScroll() {
            const links = document.querySelectorAll('#navbar .nav-links a');
            const sections = ['hero', 'experience', 'projects', 'skills', 'education'];
            const updateActive = () => {
                const scrollY = window.scrollY + 100;
                let current = 'hero';
                sections.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el.offsetTop <= scrollY) current = id;
                });
                links.forEach(a => {
                    const href = a.getAttribute('href');
                    a.classList.toggle('active', href === '#' + current);
                });
            };
            window.addEventListener('scroll', updateActive, { passive: true });
            updateActive();
            links.forEach(a => {
                a.addEventListener('click', (e) => {
                    const target = document.querySelector(a.getAttribute('href'));
                    if (target) {
                        e.preventDefault();
                        target.scrollIntoView({ behavior: 'smooth' });
                        document.getElementById('navLinks')?.classList.remove('open');
                        document.getElementById('navToggle')?.setAttribute('aria-expanded', 'false');
                    }
                });
            });
        }

        function initBackTop() {
            const btn = document.getElementById('backTop');
            if (!btn) return;
            window.addEventListener('scroll', () => {
                btn.classList.toggle('visible', window.scrollY > 400);
            }, { passive: true });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function initThemeToggle() {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const stored = localStorage.getItem('theme');
            let current = stored || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', current);
            btn.textContent = current === 'dark' ? '☀️' : '🌙';
            btn.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                btn.textContent = next === 'dark' ? '☀️' : '🌙';
            });
        }

        function initPrint() {
            document.getElementById('printBtn')?.addEventListener('click', () => {
                window.print();
            });
        }

        function initMobileNav() {
            const toggle = document.getElementById('navToggle');
            const navLinks = document.getElementById('navLinks');
            if (!toggle || !navLinks) return;
            toggle.addEventListener('click', () => {
                const open = navLinks.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                toggle.textContent = open ? '✕' : '☰';
            });
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>

</body>
</html>
