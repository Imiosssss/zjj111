<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>朱嘉俊 · 个人简历</title>
    <style>
        /* === 基础变量 === */
        :root {
            --primary: #1e3a5f;
            --accent: #d4a843;
            --bg-start: #e8edf5;
            --bg-end: #d5dcec;
            --card-bg: rgba(255, 255, 255, 0.7);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;
            --border: #e2e6ee;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 20px;
            --font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-start: #0f0f23;
                --bg-end: #1a1a3a;
                --card-bg: rgba(26,26,48,0.85);
                --text-primary: #e8e8f2;
                --text-secondary: #b0b0cc;
                --text-muted: #78789a;
                --border: #2a2a48;
            }
        }
        /* === 全局 === */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: linear-gradient(145deg, var(--bg-start), var(--bg-end));
            color: var(--text-primary);
            line-height: 1.6;
            padding-top: 68px;
            min-height: 100vh;
        }
        a { color: var(--primary); text-decoration:none; }
        ::selection { background: var(--accent); color:#fff; }

        /* === 导航栏 === */
        #navbar {
            position: fixed; top:0; left:0; right:0; height:68px;
            background: rgba(30,58,95,0.88);
            backdrop-filter: blur(12px);
            display: flex; align-items:center; justify-content:space-between;
            padding:0 24px; z-index:1000;
        }
        #navbar .brand { font-weight:700; font-size:1.2rem; color:#fff; }
        #navbar .brand span { color: var(--accent); }
        #navbar .nav-links { display:flex; gap:8px; list-style:none; flex-wrap:wrap; }
        #navbar .nav-links a {
            color: rgba(255,255,255,0.8);
            padding:6px 14px; border-radius:40px;
            font-size:0.82rem; font-weight:500;
            transition:0.2s;
        }
        #navbar .nav-links a:hover,
        #navbar .nav-links a.active { background: rgba(255,255,255,0.15); color:#fff; }
        #navbar .actions { display:flex; gap:6px; }
        #navbar .actions button {
            background: rgba(255,255,255,0.1);
            border:none; color:#fff; width:36px; height:36px;
            border-radius:50%; cursor:pointer; font-size:1rem;
            transition:0.2s;
        }
        #navbar .actions button:hover { background: rgba(255,255,255,0.25); }
        .nav-toggle { display:none; background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; }

        /* === 容器 === */
        .container { max-width:1100px; margin:0 auto; padding:0 20px 40px; position:relative; z-index:1; }

        /* === 区块 === */
        section {
            margin-bottom:40px;
            opacity:0; transform:translateY(20px);
            animation: fadeUp 0.5s ease forwards;
        }
        section:nth-child(1) { animation-delay:0.05s; }
        section:nth-child(2) { animation-delay:0.10s; }
        section:nth-child(3) { animation-delay:0.15s; }
        section:nth-child(4) { animation-delay:0.20s; }
        @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

        .section-title {
            font-size:1.4rem; font-weight:700;
            display:flex; align-items:center; gap:12px;
            margin-bottom:18px;
        }
        .section-title::after {
            content:''; flex:1; height:2px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        /* === 卡片毛玻璃 === */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border:1px solid rgba(255,255,255,0.25);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding:22px 26px;
            transition:0.25s;
        }
        .glass:hover { transform:translateY(-3px); box-shadow:0 12px 40px rgba(0,0,0,0.12); }

        /* === Hero === */
        .hero-grid {
            display: grid; grid-template-columns:1fr 1fr; gap:30px; align-items:center;
        }
        .hero-content h1 { font-size:2.4rem; font-weight:800; }
        .hero-content h1 .hl { background:linear-gradient(135deg, var(--accent), #e8c96e); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .hero-sub { font-size:1rem; color:var(--text-secondary); margin:6px 0 12px; }
        .hero-desc { color:var(--text-secondary); font-size:0.92rem; max-width:480px; margin-bottom:16px; }
        .hero-tags { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
        .hero-tags .tag {
            background:var(--card-bg); border:1px solid var(--border);
            padding:4px 14px; border-radius:40px; font-size:0.75rem; font-weight:500;
            color:var(--text-secondary); transition:0.2s;
        }
        .hero-tags .tag:hover { border-color:var(--accent); color:var(--accent); }
        .hero-actions { display:flex; flex-wrap:wrap; gap:10px; }
        .btn {
            padding:8px 24px; border-radius:40px; font-weight:600; font-size:0.9rem;
            border:none; cursor:pointer; transition:0.25s;
            display:inline-flex; align-items:center; gap:6px;
        }
        .btn-primary { background:var(--primary); color:#fff; box-shadow:0 4px 16px rgba(30,58,95,0.25); }
        .btn-primary:hover { transform:translateY(-3px); box-shadow:0 8px 28px rgba(30,58,95,0.35); }
        .btn-outline { background:transparent; color:var(--text-primary); border:1.5px solid var(--border); }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
        .btn-accent { background:var(--accent); color:#fff; }
        .btn-accent:hover { background:#e8c96e; }

        .hero-placeholder {
            background:var(--card-bg); border-radius:var(--radius);
            padding:30px; text-align:center; color:var(--text-muted);
            border:1px solid var(--border);
            min-height:120px; display:flex; align-items:center; justify-content:center;
        }

        /* === 占位 === */
        .placeholder-box {
            background:var(--card-bg); border-radius:var(--radius);
            padding:32px 24px; border:2px dashed var(--border);
            text-align:center; color:var(--text-muted);
        }
        .placeholder-box .emoji { font-size:2.2rem; display:block; margin-bottom:6px; }

        /* === 技能 === */
        .skills-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .skill-group .sg-title { font-weight:600; font-size:0.85rem; color:var(--text-secondary); margin-bottom:10px; }
        .skill-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
        .skill-row .name { font-size:0.82rem; min-width:90px; font-weight:500; }
        .skill-row .bar { flex:1; height:5px; background:var(--border); border-radius:6px; overflow:hidden; }
        .skill-row .bar .fill { height:100%; background:linear-gradient(90deg, var(--primary), var(--accent)); width:0%; transition:width 0.8s; }
        .skill-row .level { font-size:0.7rem; color:var(--text-muted); min-width:32px; text-align:right; }
        .skill-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
        .skill-tags .st { background:var(--card-bg); border:1px solid var(--border); padding:4px 14px; border-radius:40px; font-size:0.75rem; }

        /* === 教育 === */
        .edu-card .school { font-weight:700; font-size:1.05rem; }
        .edu-card .major { font-size:0.9rem; color:var(--text-secondary); }
        .edu-card .date { font-size:0.78rem; color:var(--text-muted); }
        .edu-card .high { font-size:0.82rem; color:var(--text-muted); margin-top:4px; }

        /* === 证书子页面 === */
        #certPage {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:var(--card-bg); backdrop-filter:blur(24px);
            padding:80px 40px 40px; overflow-y:auto; z-index:2000;
            animation:fadeIn 0.25s ease;
        }
        #certPage.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
        #certPage .close {
            position:fixed; top:20px; right:28px; font-size:2rem;
            background:none; border:none; color:var(--text-primary); cursor:pointer;
            transition:0.2s;
        }
        #certPage .close:hover { transform:rotate(90deg); }
        #certPage .page-title { font-size:1.8rem; font-weight:700; margin-bottom:28px; display:flex; align-items:center; gap:12px; }
        #certPage .page-title::after { content:''; flex:1; height:2px; background:linear-gradient(90deg, var(--accent), transparent); }
        .cert-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:24px; }
        .cert-card {
            background:var(--card-bg); border-radius:var(--radius);
            padding:20px 22px; border:1px solid var(--border);
            box-shadow:var(--shadow); transition:0.25s;
        }
        .cert-card:hover { transform:translateY(-4px); box-shadow:0 12px 40px rgba(0,0,0,0.12); }
        .cert-card .label { font-weight:600; font-size:0.95rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .cert-card .label .badge { font-size:0.65rem; background:var(--accent); color:#fff; padding:0 10px; border-radius:20px; line-height:1.8; }
        .cert-card img { width:100%; border-radius:8px; border:1px solid var(--border); margin-top:10px; }
        .cert-card .err { padding:16px; background:var(--bg-start); border-radius:8px; border:1px dashed var(--border); color:var(--text-muted); text-align:center; font-size:0.82rem; margin-top:10px; }
        .cert-card .hint { font-size:0.72rem; color:var(--text-muted); background:var(--bg-start); padding:2px 12px; border-radius:12px; display:inline-block; margin-top:6px; }

        .open-cert-btn {
            margin-top:14px; padding:8px 22px; background:var(--primary); color:#fff;
            border:none; border-radius:40px; font-weight:600; font-size:0.85rem;
            cursor:pointer; transition:0.25s;
        }
        .open-cert-btn:hover { transform:translateY(-3px); box-shadow:0 8px 28px rgba(30,58,95,0.35); }

        /* === 页脚 === */
        #footer { text-align:center; padding:24px; color:var(--text-muted); font-size:0.78rem; border-top:1px solid var(--border); margin-top:20px; }

        /* === 返回顶部 === */
        #backTop {
            position:fixed; bottom:30px; right:30px;
            width:44px; height:44px; border-radius:50%;
            background:var(--primary); color:#fff; border:none; font-size:1.2rem;
            cursor:pointer; opacity:0; visibility:hidden; transform:scale(0.8);
            transition:0.25s; z-index:999;
        }
        #backTop.visible { opacity:1; visibility:visible; transform:scale(1); }
        #backTop:hover { background:var(--accent); }

        /* === 响应式 === */
        @media (max-width:800px) {
            .hero-grid { grid-template-columns:1fr; }
            .skills-grid { grid-template-columns:1fr; }
            .cert-grid { grid-template-columns:1fr; }
            #certPage { padding:70px 16px 30px; }
        }
        @media (max-width:640px) {
            #navbar .nav-links { display:none; flex-direction:column; position:absolute; top:68px; left:0; right:0; background:rgba(30,58,95,0.97); padding:16px; gap:4px; }
            #navbar .nav-links.open { display:flex; }
            .nav-toggle { display:block; }
            #navbar .nav-links a { padding:10px 16px; text-align:center; width:100%; }
            .hero-content h1 { font-size:1.8rem; }
            #certPage .page-title { font-size:1.3rem; }
        }
        @media (prefers-reduced-motion:reduce) {
            * { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
            section { opacity:1 !important; transform:none !important; }
        }
        @media print {
            body { background:#fff !important; padding-top:0 !important; }
            #navbar { position:static !important; background:#fff !important; backdrop-filter:none !important; border-bottom:2px solid #ccc; }
            #navbar .nav-links a, #navbar .actions button { display:none !important; }
            .nav-toggle { display:none !important; }
            #certPage { display:none !important; }
            #backTop { display:none !important; }
            .container { max-width:100% !important; padding:0 20px !important; }
            .hero-grid { grid-template-columns:1fr !important; gap:16px !important; }
            .glass { background:#fff !important; backdrop-filter:none !important; border-color:#ddd !important; box-shadow:none !important; }
            .glass:hover { transform:none !important; box-shadow:none !important; }
            .open-cert-btn { display:none !important; }
            [data-theme] { --card-bg:#fff !important; --border:#ddd !important; --text-primary:#000 !important; }
        }
    </style>
</head>
<body>

<!-- ===== 导航栏 ===== -->
<nav id="navbar">
    <div class="brand">✦ 朱嘉俊<span>.</span></div>
    <ul class="nav-links" id="navLinks">
        <li><a href="#hero">摘要</a></li>
        <li><a href="#experience">经历</a></li>
        <li><a href="#projects">项目</a></li>
        <li><a href="#skills">技能</a></li>
        <li><a href="#education">教育</a></li>
    </ul>
    <div class="actions">
        <button id="themeToggle" aria-label="切换主题">🌓</button>
        <button id="printBtn" aria-label="打印">🖨️</button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单">☰</button>
    </div>
</nav>

<!-- ===== 主内容 ===== -->
<main class="container" id="app"></main>

<!-- ===== 证书子页面 ===== -->
<div id="certPage">
    <button class="close" id="closeCert">✕</button>
    <div class="page-title">📜 证书</div>
    <div class="cert-grid" id="certGrid"></div>
</div>

<!-- ===== 页脚 ===== -->
<footer id="footer">© 2026 朱嘉俊 · 用 ♥ 打造</footer>

<!-- ===== 返回顶部 ===== -->
<button id="backTop" aria-label="返回顶部">↑</button>

<script>
// ============================================================
// 数据
// ============================================================
const resume = {
    name: '朱嘉俊',
    phone: '15180863507',
    qq: '3324140177',
    email: '3324140177@qq.com',
    address: '湖北·武汉（即将入学）',
    summary: '准大一新生，常打乒乓球、踢足球（虽然技术不太好），喜欢阅读小说，希望能结识到更多的同伴。',
    tags: ['Python', 'Pandas', 'Requests', 'BeautifulSoup', '3DMAX', 'ZBrush', 'Photoshop', 'PPT设计', '英语二级A'],
    skills: {
        '编程与开发': [
            { name: 'Python 基础', level: 75 },
            { name: 'Pandas / Requests', level: 68 },
            { name: 'HTML / CSS', level: 55 },
            { name: 'Vibe Coding', level: 60 },
        ],
        '三维建模与数字艺术': [
            { name: '3DMAX', level: 65 },
            { name: 'ZBrush', level: 60 },
            { name: 'Photoshop', level: 70 },
            { name: 'PT (Painter)', level: 55 },
        ],
        '人工智能与数据': [
            { name: '机器学习基础', level: 62 },
            { name: '数据探索与清洗', level: 70 },
            { name: '特征工程与调优', level: 55 },
        ],
        '办公与表达': [
            { name: 'PowerPoint 设计', level: 82 },
            { name: '技术文档撰写', level: 68 },
            { name: '英语（二级A）', level: 60 },
        ]
    },
    education: {
        university: '武汉理工大学',
        major: '材料科学与工程（本科）',
        date: '2026.09 – 2030.06（预期）',
        highSchool: '贵阳市第一中学（贵州省首批重点示范性高中）'
    },
    certificates: [
        { name: '阿里达摩院人工智能高级训练师', date: '2026.07', img: '阿里人工智能训练师证书_new.jpg' },
        { name: '青少年机器人技术等级考试二级', date: '2019.12', img: '青少年机器人证书.jpg' },
        { name: '阿里云Apsara Clouder专项技能认证 - 基于百炼平台构建智能体应用', date: '2026.08', img: '阿里云Apsara Clouder专项技能认证基于百炼平台构建智能体应用_new.png' },
        { name: '阿里云Apsara Clouder专项技能认证 - 基于通义灵码实现高效AI编码实践', date: '2026.08', img: '阿里云Apsara Clouder专项技能认证基于通义灵码实现高效AI编码实践_new.png' },
        { name: '高中英语写作大赛决赛二等奖', date: '2025.12', img: '' },
        { name: '全国英语听说能力测评二级A', date: '2022.03', img: '' }
    ]
};

// ============================================================
// 渲染引擎
// ============================================================
const app = document.getElementById('app');

function render() {
    let html = '';

    // Hero
    html += `
    <section id="hero">
      <div class="hero-grid">
        <div class="hero-content">
          <h1>朱嘉俊 <span class="hl">·</span> 准大一</h1>
          <div class="hero-sub">材料科学与工程 · 武汉理工大学</div>
          <p class="hero-desc">${resume.summary}</p>
          <div class="hero-tags">${resume.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <div class="hero-actions">
            <button class="btn btn-primary" id="contactBtn">📬 联系我</button>
            <button class="btn btn-outline" id="copyEmailBtn">📋 复制邮箱</button>
          </div>
        </div>
        <div class="hero-placeholder">🌱 准大一 · 保持热爱</div>
      </div>
    </section>
    `;

    // 经历
    html += `
    <section id="experience">
      <div class="section-title">💼 经历</div>
      <div class="placeholder-box"><span class="emoji">📖</span>正在努力学习中 · 打好专业基础，积极学习编程、三维建模与人工智能知识。</div>
    </section>
    `;

    // 项目
    html += `
    <section id="projects">
      <div class="section-title">🚀 项目</div>
      <div class="placeholder-box"><span class="emoji">🌱</span>暂无正式项目 · 正在通过课程与自学积累实践能力。</div>
    </section>
    `;

    // 技能
    html += `
    <section id="skills">
      <div class="section-title">🧠 技能矩阵</div>
      <div class="skills-grid">
        ${Object.entries(resume.skills).map(([group, items]) => `
          <div class="glass skill-group">
            <div class="sg-title">${group}</div>
            ${items.map(s => `
              <div class="skill-row">
                <span class="name">${s.name}</span>
                <div class="bar"><div class="fill" data-width="${s.level}"></div></div>
                <span class="level">${s.level}%</span>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
      <div class="skill-tags">${resume.tags.map(t => `<span class="st">#${t}</span>`).join('')}</div>
    </section>
    `;

    // 教育 + 证书入口
    html += `
    <section id="education">
      <div class="section-title">🎓 教育</div>
      <div class="glass edu-card" style="max-width:600px;">
        <div class="school">${resume.education.university}</div>
        <div class="major">${resume.education.major}</div>
        <div class="date">${resume.education.date}</div>
        <div class="high">🏫 ${resume.education.highSchool}</div>
        <button class="open-cert-btn" id="openCertBtn">📜 查看全部证书 (${resume.certificates.length})</button>
      </div>
    </section>
    `;

    app.innerHTML = html;

    // 渲染证书子页面
    renderCertPage();

    // 初始化交互
    initInteractions();
}

// ============================================================
// 证书子页面
// ============================================================
function renderCertPage() {
    const grid = document.getElementById('certGrid');
    grid.innerHTML = resume.certificates.map(c => {
        const hasImg = c.img && c.img.trim() !== '';
        return `
          <div class="cert-card">
            <div class="label">${c.name} <span class="badge">${c.date}</span></div>
            ${hasImg ? `
              <img src="${c.img}" alt="${c.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
              <div class="err" style="display:none;">⚠️ 图片「${c.img}」未找到</div>
            ` : `
              <div class="err">📄 无证书图片</div>
            `}
          </div>
        `;
    }).join('');
}

// ============================================================
// 交互
// ============================================================
function initInteractions() {
    // 主题切换
    const themeBtn = document.getElementById('themeToggle');
    const html = document.documentElement;
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const stored = localStorage.getItem('theme');
    let current = stored || (prefersDark ? 'dark' : 'light');
    html.setAttribute('data-theme', current);
    themeBtn.textContent = current === 'dark' ? '☀️' : '🌙';
    themeBtn.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    // 打印
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // 移动端菜单
    const toggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
        navLinks.classList.toggle('open');
        toggle.textContent = navLinks.classList.contains('open') ? '✕' : '☰';
    });

    // 导航锚点平滑滚动
    document.querySelectorAll('#navbar .nav-links a').forEach(a => {
        a.addEventListener('click', (e) => {
            const target = document.querySelector(a.getAttribute('href'));
            if (target) {
                e.preventDefault();
                target.scrollIntoView({ behavior: 'smooth' });
                navLinks.classList.remove('open');
                toggle.textContent = '☰';
            }
        });
    });

    // 返回顶部
    const backBtn = document.getElementById('backTop');
    window.addEventListener('scroll', () => {
        backBtn.classList.toggle('visible', window.scrollY > 400);
    });
    backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // 联系我
    document.getElementById('contactBtn').addEventListener('click', () => {
        alert(`📞 电话: ${resume.phone}  |  QQ: ${resume.qq}  |  地址: ${resume.address}`);
    });

    // 复制邮箱 (防爬虫拼接)
    document.getElementById('copyEmailBtn').addEventListener('click', () => {
        const parts = resume.email.split('@');
        if (parts.length === 2) {
            const email = parts[0] + '@' + parts[1];
            navigator.clipboard.writeText(email).then(() => {
                const btn = document.getElementById('copyEmailBtn');
                const orig = btn.textContent;
                btn.textContent = '✅ 已复制';
                setTimeout(() => btn.textContent = orig, 1800);
            }).catch(() => {
                const email = parts[0] + '@' + parts[1];
                const ta = document.createElement('textarea');
                ta.value = email;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const btn = document.getElementById('copyEmailBtn');
                const orig = btn.textContent;
                btn.textContent = '✅ 已复制';
                setTimeout(() => btn.textContent = orig, 1800);
            });
        }
    });

    // 打开证书子页面
    document.getElementById('openCertBtn').addEventListener('click', () => {
        document.getElementById('certPage').classList.add('active');
        document.body.style.overflow = 'hidden';
    });
    document.getElementById('closeCert').addEventListener('click', closeCert);
    document.getElementById('certPage').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeCert();
    });
    function closeCert() {
        document.getElementById('certPage').classList.remove('active');
        document.body.style.overflow = '';
    }

    // 技能条动画
    const fills = document.querySelectorAll('.skill-row .fill');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const el = entry.target;
                el.style.width = el.dataset.width + '%';
                observer.unobserve(el);
            }
        });
    }, { threshold: 0.3 });
    fills.forEach(el => { el.style.width = '0%'; observer.observe(el); });
}

// ============================================================
// 启动
// ============================================================
document.addEventListener('DOMContentLoaded', render);
</script>

</body>
</html>
